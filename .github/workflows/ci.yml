name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: JS-Syntaxcheck
        run: |
          for f in js/*.js tests/*.js; do echo "check $f"; node --check "$f"; done
      - name: Konverter-Tests (parseInput, exifGps, Roundtrips, Beispiel-Chips)
        run: node tests/run-tests.js

  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammatur/setup-php@v2
        with:
          php-version: '8.0'
          coverage: none
      - name: PHP-Lint
        run: |
          php -l counter.php
          php -l koordinaten/counter.php
          php -l koordinaten/index.php
